    canvas { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; display: block; outline: none; }

<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var Module = { canvas: document.getElementById('canvas') };
    // Keep arrow keys and space from scrolling the page.
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) >= 0) e.preventDefault();
    });
  </script>
